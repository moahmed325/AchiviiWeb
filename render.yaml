services:
  - type: web
    name: achivii-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # migrate deploy (not db push) — db push skips the migrations folder entirely, which
    # would silently omit CREATE EXTENSION vector and the pgvector indexes in production.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Production database is managed manually in the Render dashboard.
      # Never commit the Supabase connection string.
      - key: DATABASE_URL
        sync: false
      # Production frontend origin (Vercel project: achiviiweb). CORS also
      # accepts any *.vercel.app preview origin via src/index.ts.
      - key: CLIENT_ORIGIN
        value: https://achiviiweb.vercel.app
      # Missed-sessions carry-forward writes (ND-15, docs/features/missed-sessions/04-phases.md).
      # Off: reconcile reports what it would move and writes nothing. Turned on only in the
      # Render dashboard after M3.1 (the notice that explains a moved step) is live; it is
      # also the kill switch. Only the exact string "true" turns writes on.
      - key: MISSED_SESSIONS_CARRY_ENABLED
        value: "false"
      # Lemon Squeezy stays in Test Mode until live onboarding is complete.
      # Paste the matching test-mode values from backend/.env when Render prompts
      # during Blueprint creation; never commit their values.
      - key: LEMON_SQUEEZY_ENVIRONMENT
        value: test
      - key: LEMON_SQUEEZY_TEST_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_TEST_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_TEST_PRO_MONTHLY_VARIANT_ID
        sync: false
      - key: LEMON_SQUEEZY_TEST_PRO_YEARLY_VARIANT_ID
        sync: false
      # LEMON_SQUEEZY_TEST_WEBHOOK_SIGNING_SECRET is intentionally NOT set here.
      # Create the Lemon Squeezy webhook (Phase 7) first, then add the signing
      # secret to the service in the Render dashboard.

databases:
  - name: achivii-db
    databaseName: achivii
    region: oregon
    plan: free
