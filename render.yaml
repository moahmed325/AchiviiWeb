services:
  - type: web
    name: achivii-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # Node 22 comes from "engines" in backend/package.json (Render can't see files outside rootDir).
    # A NODE_VERSION set in the Render dashboard would override it, so leave that unset.
    # migrate deploy (not db push) — db push skips the migrations folder entirely, which
    # would silently omit CREATE EXTENSION vector and the pgvector indexes in production.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Production database is managed manually in the Render dashboard.
      # Never commit the Supabase connection string.
      - key: DATABASE_URL
        sync: false
      # Production frontend origin (Vercel project: achiviiweb). CORS also
      # accepts any *.vercel.app preview origin via src/index.ts.
      - key: CLIENT_ORIGIN
        value: https://achiviiweb.vercel.app
      # Supabase Auth: the API verifies sign-in tokens against this project (publishable/anon key, never the
      # service-role key).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # The AI provider, required for plan v2. Without it, goal create answers 503 for pathways and custom goals
      # alike (ND-21). Gemini only for now; there is no fallback provider (backend/src/lib/ai/gemini.ts).
      - key: GEMINI_API_KEY
        sync: false
      # Missed-sessions carry-forward writes (ND-15, docs/archive/missed-sessions/04-phases.md).
      # Unset or anything but the exact string "true" means off: reconcile reports what it
      # would move and writes nothing. It is on ("true") in production. Managed in the Render dashboard
      # only (sync: false), so a Blueprint sync can never overwrite it; setting it back is the kill switch.
      - key: MISSED_SESSIONS_CARRY_ENABLED
        sync: false
      # Method-aware recovery: the custom profile call (M1.3b, docs/features/method-aware-recovery).
      # Unset or anything but the exact string "true" means off: custom goals keep their keyword-picked
      # template and no profile call is made. Managed in the Render dashboard only (sync: false). Set it
      # to "true" only after M2.2's eval has passed and Mo has agreed (O1).
      - key: CUSTOM_RECOVERY_PROFILES_ENABLED
        sync: false
      # Lemon Squeezy stays in Test Mode until live onboarding is complete.
      # Paste the matching test-mode values from backend/.env when Render prompts
      # during Blueprint creation; never commit their values.
      - key: LEMON_SQUEEZY_ENVIRONMENT
        value: test
      - key: LEMON_SQUEEZY_TEST_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_TEST_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_TEST_PRO_MONTHLY_VARIANT_ID
        sync: false
      - key: LEMON_SQUEEZY_TEST_PRO_YEARLY_VARIANT_ID
        sync: false
      # LEMON_SQUEEZY_TEST_WEBHOOK_SIGNING_SECRET is intentionally NOT set here.
      # Create the Lemon Squeezy webhook (Phase 7) first, then add the signing
      # secret to the service in the Render dashboard.

databases:
  - name: achivii-db
    databaseName: achivii
    region: oregon
    plan: free
