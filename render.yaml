services:
  - type: web
    name: achivii-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # migrate deploy (not db push) — db push skips the migrations folder entirely, which
    # would silently omit CREATE EXTENSION vector and the pgvector indexes in production.
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
